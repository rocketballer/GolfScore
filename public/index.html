<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E7A4A">
  <meta name="description" content="Live scoring, leaderboard and games for the Fighter Invitational scramble at Victoria Park East.">
  <meta property="og:title" content="Fighter Invitational">
  <meta property="og:description" content="Scramble · Sat, Oct 31, 2026 · Victoria Park Golf Course (East)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fighter Inv.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <title>Fighter Invitational</title>
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btn-back" data-action="go-back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
    </button>
    <div class="topbar-title" id="topbar-title">Fighter Invitational</div>
    <button class="me-chip" id="btn-me" data-action="who" aria-label="Change who you are"></button>
    <button class="icon-btn" id="btn-share" data-action="share" aria-label="Share tournament link">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.1c-.8 0-1.4.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .5.1.7L8 9.8C7.5 9.3 6.8 9 6 9c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.1 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9-1.2-2.9-2.8-2.9z"/></svg>
    </button>
  </header>

  <!-- Text is filled in from tournament data once it loads. -->
  <section class="hero" id="hero">
    <img class="hero-img" src="img/course-1280.webp" srcset="img/course-720.webp 720w, img/course-1280.webp 1280w" sizes="100vw" alt="" fetchpriority="high">
    <div class="hero-inner">
      <h1 id="hero-title">Fighter Invitational</h1>
      <p class="hero-sub"><span aria-hidden="true">🏆</span> <span id="hero-format">Scramble tournament</span></p>
      <p class="hero-date" id="hero-date"></p>
    </div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#home" data-tab="home">Home</a>
    <a href="#leaderboard" data-tab="leaderboard">Leaderboard</a>
    <a href="#schedule" data-tab="schedule">Schedule</a>
    <a href="#chat" data-tab="chat">Chat</a>
  </nav>

  <main id="view" class="view" aria-live="polite">
    <p class="loading">Loading tournament…</p>
  </main>

  <div class="bottom-bar" id="bottom-bar">
    <button class="btn btn-primary" id="btn-enter" data-action="enter-scores">Enter scores</button>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
